<!-- client-form.component.html -->
<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-4">

  @if (error) {
    <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
      {{ error }}
    </div>
  }

  <!-- Name + Company -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="space-y-1.5">
      <label class="block text-sm font-medium text-gray-700">Full Name *</label>
      <input formControlName="name" type="text" placeholder="John Doe"
        class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg outline-none
               focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all"
        [class.border-red-400]="form.get('name')?.invalid && form.get('name')?.touched" />
      @if (form.get('name')?.invalid && form.get('name')?.touched) {
        <p class="text-xs text-red-500">Name is required</p>
      }
    </div>

    <div class="space-y-1.5">
      <label class="block text-sm font-medium text-gray-700">Company</label>
      <input formControlName="company" type="text" placeholder="Acme Corp"
        class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg outline-none
               focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all" />
    </div>
  </div>

  <!-- Email + Phone -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="space-y-1.5">
      <label class="block text-sm font-medium text-gray-700">Email *</label>
      <input formControlName="email" type="email" placeholder="john@example.com"
        class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg outline-none
               focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all"
        [class.border-red-400]="form.get('email')?.invalid && form.get('email')?.touched" />
      @if (form.get('email')?.invalid && form.get('email')?.touched) {
        <p class="text-xs text-red-500">Valid email is required</p>
      }
    </div>

    <div class="space-y-1.5">
      <label class="block text-sm font-medium text-gray-700">Phone</label>
      <input formControlName="phone" type="text" placeholder="+33 6 12 34 56 78"
        class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg outline-none
               focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all" />
    </div>
  </div>

  <!-- Address -->
  <div class="space-y-1.5">
    <label class="block text-sm font-medium text-gray-700">Address</label>
    <textarea formControlName="address" rows="2" placeholder="12 Rue de la Paix, Paris"
      class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg outline-none
             focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all resize-none">
    </textarea>
  </div>

  <!-- Buttons -->
  <div class="flex items-center justify-end gap-3 pt-2">
    <app-button variant="secondary" type="button" (click)="cancelled.emit()">
      Cancel
    </app-button>
    <app-button variant="primary" type="submit" [loading]="loading">
      {{ isEdit ? 'Save Changes' : 'Add Client' }}
    </app-button>
  </div>

</form>
