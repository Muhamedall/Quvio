<!-- sidebar.component.html -->

<!-- FIXED sidebar — always visible on desktop, slides on mobile -->
<aside
  class="fixed top-0 left-0 h-full z-30 w-64 bg-gray-900 flex flex-col
         transition-transform duration-300 ease-in-out
         -translate-x-full lg:translate-x-0"
  [class.-translate-x-full]="!isOpen"
  [class.translate-x-0]="isOpen"
>

  <!-- ── Logo ───────────────────────────────────────── -->
  <div class="flex items-center gap-3 px-5 py-5 border-b border-white/10 shrink-0">
    <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center shrink-0">
      <span class="text-white font-bold text-sm">Q</span>
    </div>
    <span class="text-white font-bold text-lg tracking-tight">Quvio</span>
  </div>

  <!-- ── Nav Links ──────────────────────────────────── -->
  <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-indigo-600 text-white"
        [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium
               text-gray-400 hover:text-white hover:bg-white/10
               transition-colors duration-150"
        (click)="onLinkClick()"
      >
        <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path [attr.d]="item.icon" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- ── User block ─────────────────────────────────── -->
  <div class="shrink-0 px-3 py-4 border-t border-white/10 space-y-1">

    <!-- User info -->
    <div class="flex items-center gap-3 px-2 py-2">
      <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center shrink-0">
        <span class="text-white text-xs font-bold uppercase">
          {{ authService.currentUser()?.name?.charAt(0) ?? 'U' }}
        </span>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-white text-sm font-medium truncate">
          {{ authService.currentUser()?.name ?? 'User' }}
        </p>
        <p class="text-gray-500 text-xs truncate">
          {{ authService.currentUser()?.email ?? '' }}
        </p>
      </div>
    </div>

    <!-- Logout -->
    <button
      type="button"
      class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium
             text-gray-400 hover:text-white hover:bg-white/10 transition-colors duration-150"
      (click)="logout()"
    >
      <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8">
        <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Logout</span>
    </button>

  </div>
</aside>
