<!-- navbar.component.html -->
<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between
               px-4 lg:px-6 shrink-0 z-10">

  <!-- Left: hamburger (mobile) + logo -->
  <div class="flex items-center gap-4">

    <!-- Hamburger — only on mobile -->
    <button
      type="button"
      class="p-2 rounded-lg text-gray-500 hover:text-gray-900 hover:bg-gray-100
             transition-colors lg:hidden"
      (click)="menuToggled.emit()"
      aria-label="Toggle sidebar"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- App name — desktop only -->
    <span class="hidden lg:block text-sm font-semibold text-gray-700">Quvio</span>

  </div>

  <!-- Right: quick actions + user avatar -->
  <div class="flex items-center gap-3">

    <!-- New Invoice button — hidden on small screens -->
    <a
      routerLink="/invoices/new"
      class="hidden sm:flex items-center gap-2 px-3 py-2
             bg-indigo-500 hover:bg-indigo-600 text-white text-sm
             font-semibold rounded-lg transition-colors duration-150"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5">
        <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      New Invoice
    </a>

    <!-- User avatar — mobile only (desktop shows in sidebar) -->
    <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center
                justify-center lg:hidden shrink-0">
      <span class="text-white text-xs font-bold uppercase">
        {{ authService.currentUser()?.name?.charAt(0) ?? 'U' }}
      </span>
    </div>

  </div>
</header>
