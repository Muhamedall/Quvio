<!-- ============================================================
loader.component.html
Uses an SVG spinner — more reliable than border-based spinners.
============================================================ -->

<div [class]="wrapperClasses" role="status" [attr.aria-label]="text || 'Loading'">

  <!-- SVG spinner -->
  <svg [class]="spinnerClasses" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <!-- Gray track circle -->
    <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
    <!-- Colored spinning arc -->
    <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
  </svg>

  <!-- Optional loading label -->
  @if (text) {
    <p [class]="textClasses">{{ text }}</p>
  }

</div>
