<!-- ============================================================
card.component.html
============================================================ -->

<div [class]="cardClasses" (click)="onClick()" [attr.role]="hoverable ? 'button' : null">

  <!-- ── HEADER ── only renders when title is provided -->
  @if (title) {
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">

      <div class="min-w-0">
        <h3 class="text-sm font-semibold text-gray-900 truncate">{{ title }}</h3>
        @if (subtitle) {
          <p class="text-xs text-gray-500 mt-0.5">{{ subtitle }}</p>
        }
      </div>

      <!-- Header action slot: <app-button slot="action"> -->
      <div class="shrink-0 ml-4">
        <ng-content select="[slot=action]"></ng-content>
      </div>

    </div>
  }

  <!-- ── BODY ── -->
  <div [class]="bodyClasses">

    <!-- SKELETON state while loading -->
    @if (loading) {
      <div class="space-y-3 animate-pulse">
        <div class="h-4 bg-gray-200 rounded w-3/5"></div>
        <div class="h-3 bg-gray-200 rounded w-full"></div>
        <div class="h-3 bg-gray-200 rounded w-4/5"></div>
        <div class="h-3 bg-gray-200 rounded w-2/3"></div>
      </div>

    } @else {
      <!-- Normal content projected from parent -->
      <ng-content></ng-content>
    }

  </div>

  <!-- ── FOOTER ── hidden when empty -->
  <div class="empty:hidden px-6 py-4 border-t border-gray-100 bg-gray-50">
    <ng-content select="[slot=footer]"></ng-content>
  </div>

</div>
