<!-- ============================================================
modal.component.html

The modal has 3 layers:
  1. Backdrop     — dark dimmed overlay behind the dialog
  2. Dialog box   — the white card with content inside
  3. Three slots  — header (auto), body (default), footer (slot)

@if (isOpen) ensures the modal is fully removed from the DOM
when closed — not just hidden. This resets form state properly.
============================================================ -->

@if (isOpen) {

  <!-- ── BACKDROP ──────────────────────────────────────── -->
  <!-- Fixed overlay covering the full screen -->
  <!-- Click on it (not the dialog) to close -->
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-[fadeIn_0.15s_ease]"
    (click)="onBackdropClick($event)"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title"
  >

    <!-- ── DIALOG BOX ──────────────────────────────────── -->
    <!-- w-full + max-w-* = responsive: full on mobile, capped on desktop -->
    <div
      class="relative w-full bg-white rounded-2xl shadow-2xl flex flex-col max-h-[90vh] animate-[scaleIn_0.2s_ease]"
      [ngClass]="sizeClasses[size]"
    >

      <!-- ── HEADER ──────────────────────────────────── -->
      @if (title) {
        <div class="flex items-start justify-between px-6 py-5 border-b border-gray-100 shrink-0">

          <div class="space-y-0.5">
            <h2 class="text-lg font-semibold text-gray-900 leading-tight">{{ title }}</h2>
            @if (subtitle) {
              <p class="text-sm text-gray-500">{{ subtitle }}</p>
            }
          </div>

          <!-- X Close button -->
          @if (closable) {
            <button
              type="button"
              class="ml-4 shrink-0 p-1.5 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-colors duration-150"
              (click)="close()"
              aria-label="Close"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          }

        </div>
      }

      <!-- ── BODY ────────────────────────────────────── -->
      <!-- overflow-y-auto = body scrolls if content is tall, header/footer stay fixed -->
      <div class="flex-1 overflow-y-auto px-6 py-5">
        <ng-content></ng-content>
      </div>

      <!-- ── FOOTER ──────────────────────────────────── -->
      <!-- Hidden when empty — no extra spacing when no buttons are needed -->
      <div class="empty:hidden shrink-0 flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-2xl">
        <ng-content select="[slot=footer]"></ng-content>
      </div>

    </div>
  </div>

}
